# Persona 4 Golden : Steam 1113000 <-> PS Vita PCSB00245 (EUR).
# Procédure manuelle validée en phase 0, voir le README.
id: p4g
name: Persona 4 Golden
adapter: p4g
pc:
  steam_appid: 1113000
  # {steam_userdata} = Steam\userdata\<id> (section [steam] de la config).
  path: "{steam_userdata}/1113000/remote"
vita:
  title_id: PCSB00245
  path: ux0:user/00/savedata/PCSB00245
  # Slots de Save Manager (config par défaut : base=/data/savegames,
  # slot_format=%s/SLOT%d). Slot 0 : copie décryptée faite par Backup, lue
  # par pull. Slot 1 : sauvegarde complète écrite par push, à remettre en
  # place avec Restore.
  dump: ux0:data/savegames/PCSB00245/SLOT0
  inbox: ux0:data/savegames/PCSB00245/SLOT1
